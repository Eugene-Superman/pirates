<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pirate Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b3a52;
      }
      #app canvas {
        display: block;
      }
      .variants {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        max-width: calc(100vw - 32px);
        padding: 6px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.5);
        font: 14px Arial, sans-serif;
      }
      .variants a {
        padding: 6px 10px;
        border-radius: 6px;
        color: #fff;
        text-decoration: none;
        white-space: nowrap;
      }
      .variants a:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .variants a.active {
        background: #f2c14e;
        color: #222;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
